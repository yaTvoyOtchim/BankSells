# Какой Gradle скачивать и откуда.
# networkTimeout увеличен с 10 до 120 секунд — лечит SocketTimeoutException на медленной сети.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# Вариант 1 (по умолчанию) — официальный сервер:
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip

# Вариант 2 — если официальный не качается, закомментируйте строку выше
# и раскомментируйте зеркало (Huawei Cloud, обычно быстрое из РФ):
#distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip

# Вариант 3 — скачали gradle-8.9-bin.zip вручную браузером:
# положите файл, например, в C:\gradle\ и укажите путь к нему:
#distributionUrl=file\:///C:/gradle/gradle-8.9-bin.zip
